name: Validate Astro site

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Astro
        run: npm run check
      - name: Build static site
        run: npm run build
